name: GitHub Actions
run-name: ${{ github.actor }} is testing out GitHub Actions 
on: [push]
permissions:
  contents: write
jobs:
  Explore-GitHub-Actions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4/TP2
      - run: docker build -t rep-lab2 . 
      - run: docker run --rm   --user "$(id -u):$(id -g)"   -v "$(pwd)":/out   -e OUTPUT_DIR=/out   rep-lab2
      
